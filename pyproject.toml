[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-extract"
version = "0.1.0"
description = "Configurable agent for extracting structured data from WhatsApp chat exports."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "rapidfuzz>=3.0.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.scripts]
whatsapp-extract = "whatsapp_extract.cli:main"

[tool.setuptools.packages.find]
include = ["whatsapp_extract*"]
